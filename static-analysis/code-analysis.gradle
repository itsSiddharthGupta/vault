apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: "com.diffplug.spotless"

afterEvaluate {
    detekt {
        input = files("src/main/java")
        config = files("$rootDir/static-analysis/detekt-config.yml")
        reports {
            xml {
                enabled = true
            }
            html {
                enabled = true
            }
        }
        //Optional baseline, uncomment & run gradle command detektBaseline to exclude existing issues
        parallel = true
        baseline = file("$projectDir/detekt-baseline.xml")
    }

    spotless {
        kotlin {
            target("**/*.kt")
            targetExclude("**/build/")
            ktfmt().kotlinlangStyle()
            ktlint("1.2.1").setEditorConfigPath("$rootDir/static-analysis/.editorconfig")
        }
        kotlinGradle {
            target '*.gradle.kts' // default target for kotlinGradle
            ktfmt().kotlinlangStyle()
            ktlint("1.2.1").setEditorConfigPath("$rootDir/static-analysis/.editorconfig")
        }
    }


}

tasks.detekt.jvmTarget = "1.8"

// Add detekt plugin dependencies separately from the main configuration
dependencies {
    detektPlugins(libs.detekt.formatting)
    detekt(libs.detekt.cli)
    detektPlugins(libs.detekt.compose)
}
